# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.20.1.1
group=com.coolerpromc.mctest
java_version=17

# Common
minecraft_version=1.20.1
mod_name=MCTest
mod_author=CoolerProMC
mod_id=mctest
license=MIT
credits=
description=Dev-only mod that exposes a local WebSocket control API so tools (e.g. an MCP server) can drive a running Minecraft client, and inspect a dedicated server, for testing.
minecraft_version_range=[1.20.1]
## MCP version the common project compiles against (vanilla, Mojang mappings)
mcp_version=1.20.1
# ParchmentMC parameter names, see https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.92.12+1.20.1
# Oldest loader 26.1 mods use, so MCTest loads in their dev runs.
fabric_loader_version=0.18.4

# Forge, see https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
forge_version=47.4.28
forge_loader_version_range=[47,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
