# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=1.21.1.1
group=com.coolerpromc.mctest
java_version=21

# Common
minecraft_version=1.21.1
mod_name=MCTest
mod_author=CoolerProMC
mod_id=mctest
license=MIT
credits=
description=Dev-only mod that exposes a local WebSocket control API so tools (e.g. an MCP server) can drive a running Minecraft client, and inspect a dedicated server, for testing.
minecraft_version_range=[1.21.1]
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# ParchmentMC parameter names, see https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.116.7+1.21.1
# Oldest loader 26.1 mods use, so MCTest loads in their dev runs.
fabric_loader_version=0.18.4

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=21.1.218
neoforge_loader_version_range=[1,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
