# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
version=26.1.0.1
group=com.coolerpromc.mctest
java_version=25

# Common
minecraft_version=26.1.2
# Published as mctest-<loader>-26.1: one build covers 26.1, 26.1.1 and 26.1.2.
artifact_minecraft_version=26.1
mod_name=MCTest
mod_author=CoolerProMC
mod_id=mctest
license=MIT
credits=
description=Dev-only mod that exposes a local WebSocket control API so tools (e.g. an MCP server) can drive a running Minecraft client, and inspect a dedicated server, for testing.
minecraft_version_range=[26.1, 26.2)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.155.3+26.1.2
# Oldest loader 26.1 mods use, so MCTest loads in their dev runs.
fabric_loader_version=0.18.4

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.1.2.122
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
